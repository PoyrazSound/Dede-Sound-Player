<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poyraz Dede Sound Player — Module 03 Voice Engine Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}.title{font-size:25px;font-weight:700}.sub{color:#aaa;margin:6px 0 18px}.panel{background:#1b1b1b;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:14px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.control{display:flex;flex-direction:column;gap:5px;min-width:130px}label{font-size:12px;color:#aaa}input,select,button{font:inherit;border:1px solid #444;border-radius:7px;background:#252525;color:#fff;padding:9px}button{cursor:pointer}.primary{background:#184d36}.danger{background:#5b2020}.value{color:#7ee2b8}.status{font:13px monospace;white-space:pre-wrap;background:#0d0d0d;padding:12px;border-radius:8px;min-height:110px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#111;border-radius:8px;padding:12px}.stat b{display:block;font-size:20px;margin-top:5px}.keyboard{display:flex;position:relative;height:190px;overflow-x:auto}.key{flex:0 0 42px;height:180px;background:#eee;color:#111;border:1px solid #777;border-radius:0 0 5px 5px;position:relative;cursor:pointer;user-select:none}.key.active{background:#8ee0bd}.key span{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:10px}.black{position:absolute;z-index:2;width:27px;height:112px;background:#111;border:1px solid #555;border-radius:0 0 4px 4px;top:0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.key{flex-basis:34px}.keyboard{height:165px}.key{height:155px}}
</style>
</head>
<body><div class="wrap">
<div class="title">Poyraz Dede Sound Player v2 — Module 03</div><div class="sub">VOICE ENGINE / Polyphonic + Monophonic Test</div>
<div class="panel"><div class="row"><button id="start" class="primary">AUDIO START</button><button id="panic" class="danger">ALL NOTES OFF</button><div class="control"><label>MODE</label><select id="mode"><option value="poly">POLY</option><option value="mono">MONO</option></select></div><div class="control"><label>MASTER VOLUME <span id="volVal" class="value">18%</span></label><input id="volume" type="range" min="0" max="1" step=".01" value=".18"></div><div class="control"><label>ATTACK <span id="attVal" class="value">8 ms</span></label><input id="attack" type="range" min=".001" max=".5" step=".001" value=".008"></div><div class="control"><label>RELEASE <span id="relVal" class="value">80 ms</span></label><input id="release" type="range" min=".01" max="2" step=".01" value=".08"></div><div class="control"><label>MAX VOICES <span id="maxVal" class="value">16</span></label><input id="maxVoices" type="range" min="1" max="64" value="16"></div></div></div>
<div class="panel stats"><div class="stat">AUDIO<b id="audioState">OFF</b></div><div class="stat">ACTIVE VOICES<b id="voiceCount">0</b></div><div class="stat">LAST NOTE<b id="lastNote">—</b></div><div class="stat">VELOCITY<b id="lastVel">—</b></div></div>
<div class="panel"><b>61 KEY TEST KEYBOARD</b><div style="height:10px"></div><div id="keyboard" class="keyboard"></div><div style="color:#888;font-size:12px;margin-top:8px">Bilgisayar klavyesi: A W S E D F T G Y H U J K</div></div>
<div class="panel"><b>TEST LOG</b><div id="log" class="status">Hazır. AUDIO START'a bas.</div></div>
</div>
<script>
class VoiceEngine{constructor(){this.mode='poly';this.maxVoices=16;this.masterGain=.18;this.attack=.008;this.release=.08;this.voices=new Map;this.ctx=null;this.output=null}async init(){if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('Web Audio API desteklenmiyor.');this.ctx=new C;this.output=this.ctx.createGain();this.output.gain.value=this.masterGain;this.output.connect(this.ctx.destination)}if(this.ctx.state==='suspended')await this.ctx.resume()}setMode(m){this.mode=m==='mono'?'mono':'poly';if(this.mode==='mono')this.allNotesOff()}noteOn(note,velocity=100){if(!this.ctx)return;if(this.mode==='mono')this.allNotesOff();if(this.voices.has(note))this.noteOff(note,true);while(this.voices.size>=this.maxVoices)this.noteOff(this.voices.keys().next().value,true);const now=this.ctx.currentTime,f=440*Math.pow(2,(note-69)/12),osc=this.ctx.createOscillator(),gain=this.ctx.createGain(),level=Math.max(.0002,Math.min(1,velocity/127));osc.type='sawtooth';osc.frequency.setValueAtTime(f,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(level,now+this.attack);osc.connect(gain);gain.connect(this.output);osc.start(now);this.voices.set(note,{osc,gain})}noteOff(note,immediate=false){const v=this.voices.get(note);if(!v||!this.ctx)return;const now=this.ctx.currentTime,end=now+(immediate?.005:this.release);const cur=Math.max(.0001,v.gain.gain.value);v.gain.gain.cancelScheduledValues(now);v.gain.gain.setValueAtTime(cur,now);v.gain.gain.exponentialRampToValueAtTime(.0001,end);try{v.osc.stop(end+.01)}catch(e){}this.voices.delete(note)}allNotesOff(){[...this.voices.keys()].forEach(n=>this.noteOff(n,true))}}
const engine=new VoiceEngine,pressed=new Set,log=document.getElementById('log'),names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];function nn(n){return names[n%12]+(Math.floor(n/12)-1)}function stats(n,v){document.getElementById('voiceCount').textContent=engine.voices.size;if(n!=null)document.getElementById('lastNote').textContent=nn(n);if(v!=null)document.getElementById('lastVel').textContent=v;document.querySelectorAll('.key').forEach(k=>k.classList.toggle('active',pressed.has(+k.dataset.note)))}async function start(){try{await engine.init();document.getElementById('audioState').textContent='ON';log.textContent='MODÜL 03 hazır.\nPoly/Mono Voice Engine aktif.\n61 tuş + PC klavyesi + MIDI test edilebilir.'}catch(e){log.textContent='HATA: '+e.message}}
document.getElementById('start').onclick=start;document.getElementById('panic').onclick=()=>{engine.allNotesOff();pressed.clear();stats();log.textContent+='\nALL NOTES OFF'};document.getElementById('mode').onchange=e=>{engine.setMode(e.target.value);log.textContent='MODE: '+e.target.value.toUpperCase()};document.getElementById('volume').oninput=e=>{engine.masterGain=+e.target.value;if(engine.output)engine.output.gain.value=engine.masterGain;document.getElementById('volVal').textContent=Math.round(engine.masterGain*100)+'%'};document.getElementById('attack').oninput=e=>{engine.attack=+e.target.value;document.getElementById('attVal').textContent=Math.round(engine.attack*1000)+' ms'};document.getElementById('release').oninput=e=>{engine.release=+e.target.value;document.getElementById('relVal').textContent=Math.round(engine.release*1000)+' ms'};document.getElementById('maxVoices').oninput=e=>{engine.maxVoices=+e.target.value;document.getElementById('maxVal').textContent=e.target.value};
const kb=document.getElementById('keyboard');for(let n=36;n<=96;n++){if([1,3,6,8,10].includes(n%12))continue;const k=document.createElement('div');k.className='key';k.dataset.note=n;k.innerHTML='<span>'+nn(n)+'</span>';k.onpointerdown=async e=>{e.preventDefault();await start();pressed.add(n);engine.noteOn(n,100);stats(n,100)};k.onpointerup=()=>{pressed.delete(n);engine.noteOff(n);stats()};k.onpointerleave=e=>{if(e.buttons){pressed.delete(n);engine.noteOff(n);stats()}};kb.appendChild(k)}
const map={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72},down=new Set;document.onkeydown=async e=>{const n=map[e.key.toLowerCase()];if(e.repeat||n==null)return;e.preventDefault();await start();if(down.has(n))return;down.add(n);pressed.add(n);engine.noteOn(n,100);stats(n,100)};document.onkeyup=e=>{const n=map[e.key.toLowerCase()];if(n==null)return;down.delete(n);pressed.delete(n);engine.noteOff(n);stats()};
if(navigator.requestMIDIAccess)navigator.requestMIDIAccess().then(a=>{const bind=()=>a.inputs.forEach(i=>i.onmidimessage=e=>{const[s,n,v]=e.data,c=s&240;if(c===144&&v){start();pressed.add(n);engine.noteOn(n,v);stats(n,v)}else if(c===128||(c===144&&!v)){pressed.delete(n);engine.noteOff(n);stats()}});bind();a.onstatechange=bind;log.textContent+='\nMIDI girişleri hazır.'}).catch(e=>log.textContent+='\nMIDI: '+e.message);else log.textContent+='\nMIDI API yok.';
</script></body></html>
